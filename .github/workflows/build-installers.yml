name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    # Required so the action can create the GitHub release and upload assets.
    # Repositories created with GitHub's default settings issue a read-only
    # GITHUB_TOKEN, which makes release creation fail with HTTP 403.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles so the in-app "Download & install"
          # button can verify them. Repository secrets:
          #   TAURI_SIGNING_PRIVATE_KEY         (contents of the .key file)
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for an unencrypted key)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DuckTrack v__VERSION__"
          releaseBody: "See the assets below for installers for your platform."
          # Must be published (not draft) for the in-app update checker to see it.
          releaseDraft: false
          prerelease: false
          # Emits latest.json, which is the manifest the updater plugin reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}